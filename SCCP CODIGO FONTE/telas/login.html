<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — La Baguette</title>
  <link rel="stylesheet" href="../style/login.css">
  <script src="../src/login.js" defer></script>
</head>
<body>
  <div class="card">
    <img src="../images/logo.png" alt="La Baguette" class="logo">
    <h1>La Baguette</h1>

    <form id="form">
      <label for="login">Login</label>
      <input id="login" type="text" placeholder="Seu login">

      <label for="senha">Senha</label>
      <input id="senha" type="password" placeholder="Sua senha">

      <p id="erro"></p>
      <button type="submit">Entrar</button>
    </form>
  </div>
</body>
</html>
